[project]
name = "kidink-server"
version = "0.1.0"
description = "HTTP server for the kidink smart display"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1",
    "httpx>=0.28.1",
    "icalendar>=7.2.0",
    "numpy>=2.5.0",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "pydantic-settings>=2.14.2",
    "recurring-ical-events>=3.8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.15",
    "ty>=0.0.47",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]
# Block all real network access by default (pytest-socket): tests must use the
# Flask test client or fakes, never live I/O. Deselect browser tests by default;
# run them explicitly with `uv run pytest -m browser`.
addopts = ["--disable-socket", "-m", "not browser"]
markers = [
    "browser: drives headless Chromium via Playwright; slow, deselected by default. Also decorate with @pytest.mark.enable_socket so the browser/internal requests can use sockets.",
]
