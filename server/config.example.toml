# Template for the local kidink server configuration.
#
# Copy to config.toml (gitignored) and adjust. Any value omitted here falls back
# to the model default in app/config.py; environment variables (KIDINK_*) win
# over the file.
#
# ORDER MATTERS. In TOML, every bare `key = value` after a table header such as
# `[[kids]]` belongs to *that table*, not to the top level. So keep all plain
# settings above the [module_model_tiers] and [[kids]] sections at the bottom of
# this file - a device_* key added after them silently becomes a kid's field.
# (`Kid` forbids unknown keys, so that mistake now fails loudly at startup.)

# Display timezone (IANA / zoneinfo name, e.g. "US/Pacific", "America/New_York").
timezone = "US/Pacific"

# Private Google Calendar ICS feed (events + chores, §6.1). REQUIRED — the server
# fails to start without it. This is a SECRET, unauthenticated URL: keep it only in
# config.toml (gitignored) or the KIDINK_FAMILY_CALENDAR_ICS_URL env var, never here.
# Must point at the iCalendar export, e.g.
#   https://calendar.google.com/calendar/ical/<calendar-id>/public/basic.ics
family_calendar_ics_url = "https://calendar.google.com/calendar/ical/REPLACE_ME/public/basic.ics"

# Anylist meal-plan ICS feed (dinner, §6.1, §13). REQUIRED - the server fails to
# start without it. This is a SECRET, unauthenticated URL: keep it only in
# config.toml (gitignored) or the KIDINK_ANYLIST_MEALPLAN_ICS_URL env var, never
# here. Anylist generates the subscription link under Meal Plan > calendar
# export, e.g.
#   https://icalendar.anylist.com/<token>.ics
anylist_mealplan_ics_url = "https://icalendar.anylist.com/REPLACE_ME.ics"

# OpenAI API key for AI image generation (§7.2). REQUIRED — the server fails to
# start without it. This is a SECRET: keep it only in config.toml (gitignored) or
# the KIDINK_OPENAI_API_KEY env var, never here.
openai_api_key = "sk-REPLACE_ME"

# Google Maps Platform API key for the Weather API (§ Weather). REQUIRED — the
# server fails to start without it. This is a SECRET: keep it only in config.toml
# (gitignored) or the KIDINK_GOOGLE_MAPS_API_KEY env var, never here.
google_maps_api_key = "REPLACE_ME"

# Weather location (§ Weather): the daily forecast is fetched for these
# coordinates. Defaults to downtown San Francisco — set your home's coordinates.
latitude = 37.7749
longitude = -122.4194

# Root directory for app-managed storage (§18): sqlite.db (image metadata),
# gen_images/ (generated PNGs), prompt_images/ (prompt attachments). A relative
# path is resolved against this directory (server/).
app_storage_path = ".storage"

# Daily joke / riddle (§15). `joke_start_date` is the base date for the index:
# the joke shown on a date is jokes[(date - joke_start_date).days % N], so the
# curated list loops. The jokes themselves live in the DB (the `jokes` table),
# managed on the /admin/jokes page.
joke_start_date = 2026-01-01

# --- Inkplate firmware (specs/firmware.md) ---------------------------------
# Consumed only by `uv run python -m app.firmware`, which bakes them into the
# gitignored arduino/kidink/config.h and flashes the board. The server itself
# ignores them, so a checkout that never touches hardware can leave them alone.

# Wi-Fi network the panel joins. These are SECRETS: keep them only in
# config.toml (gitignored) or the KIDINK_DEVICE_WIFI_* env vars, never here.
# The passphrase is never logged by the firmware, not even its length.
device_wifi_ssid = "REPLACE_ME"
device_wifi_password = "REPLACE_ME"

# Where the device fetches its picture from. REQUIRED before flashing - there is
# no default, because it must be an address the board can reach over the LAN.
# "localhost" is exactly wrong here: it would resolve on the device, to itself.
# A bare host:port gains an http:// scheme; https:// is rejected, since the
# firmware carries no TLS stack.
device_server_base_url = "192.168.1.20:5051"
device_fetch_path = "/display"
device_time_path = "/time"

# Wake schedule, 5-field crontab syntax, evaluated on-device against local
# wall-clock time. The default wakes every two hours from 05:00 to 21:00 - the
# board is bistable, so it keeps showing the last image in between. Validated at
# load, and `python -m app.firmware` prints the next few wake times.
device_wake_cron = "0 5-21/2 * * *"

# Daily clock-sync wake (HH:MM, 24-hour, local). Once a day the device wakes,
# fetches device_time_path (the /time endpoint), and writes the returned local
# timestamp into its RTC - a super-simple NTP stand-in that keeps drift bounded
# to a day. Keep it outside the display wake window so a sync never displaces a
# repaint.
device_clock_sync_time = "03:15"

# Deadlines. A timeout means "sleep without painting and try at the next
# scheduled wake" - there are no retries. The HTTP budget is generous because a
# cold image cache makes the server generate images and screenshot inline.
device_wifi_timeout_seconds = 60
device_http_timeout_seconds = 300

# Sleep length when the schedule cannot be computed - only on a first boot whose
# fetch failed, so the device has never seen a server Date header to set its RTC.
device_fallback_sleep_seconds = 900

# A WAKE button press skips the If-None-Match header, so it always repaints
# rather than quietly getting a 304 and appearing to do nothing.
device_repaint_on_button = true

# POSIX TZ string for the device (it has no zoneinfo database). Leave empty to
# derive it from `timezone` above, e.g. US/Pacific -> "PST8PDT,M3.2.0,M11.1.0".
device_posix_tz = ""

# Per-module image-model overrides (§18). Modules not listed use the default
# model (gpt-image-2).
# [module_model_tiers]
# Calendar = "gpt-image-2"

# Kids shown on the board (§8, §18): full name plus the short label (initials)
# rendered next to their events. Events' `kids` values (event-description TOML,
# §6.4) are matched case-insensitively against `label` or `name`; an event with
# an empty `kids` field is shared (applies to every kid) and shows no badge.
# Order matters: it fixes each kid's badge color and label position.
# [[kids]]
# name = "Julia"
# label = "J"
# [[kids]]
# name = "Sam"
# label = "S"

