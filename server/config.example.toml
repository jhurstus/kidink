# Template for the local kidink server configuration.
#
# Copy to config.toml (gitignored) and adjust. Any value omitted here falls back
# to the model default in app/config.py; environment variables (KIDINK_*) win
# over the file.

# Display timezone (IANA / zoneinfo name, e.g. "US/Pacific", "America/New_York").
timezone = "US/Pacific"

# Private Google Calendar ICS feed (events + chores, §6.1). REQUIRED — the server
# fails to start without it. This is a SECRET, unauthenticated URL: keep it only in
# config.toml (gitignored) or the KIDINK_FAMILY_CALENDAR_ICS_URL env var, never here.
# Must point at the iCalendar export, e.g.
#   https://calendar.google.com/calendar/ical/<calendar-id>/public/basic.ics
family_calendar_ics_url = "https://calendar.google.com/calendar/ical/REPLACE_ME/public/basic.ics"

# OpenAI API key for AI image generation (§7.2). REQUIRED — the server fails to
# start without it. This is a SECRET: keep it only in config.toml (gitignored) or
# the KIDINK_OPENAI_API_KEY env var, never here.
openai_api_key = "sk-REPLACE_ME"

# Google Maps Platform API key for the Weather API (§ Weather). REQUIRED — the
# server fails to start without it. This is a SECRET: keep it only in config.toml
# (gitignored) or the KIDINK_GOOGLE_MAPS_API_KEY env var, never here.
google_maps_api_key = "REPLACE_ME"

# Weather location (§ Weather): the daily forecast is fetched for these
# coordinates. Defaults to downtown San Francisco — set your home's coordinates.
latitude = 37.7749
longitude = -122.4194

# Root directory for app-managed storage (§18): sqlite.db (image metadata),
# gen_images/ (generated PNGs), prompt_images/ (prompt attachments). A relative
# path is resolved against this directory (server/).
app_storage_path = ".storage"

# Per-module image-model overrides (§18). Modules not listed use the default
# model (gpt-image-2).
# [module_model_tiers]
# Calendar = "gpt-image-2"

# Kids shown on the board (§8, §18): full name plus the short label (initials)
# rendered next to their events. Events' `kids` values (event-description TOML,
# §6.4) are matched case-insensitively against `label` or `name`; an event with
# an empty `kids` field is shared (applies to every kid) and shows no badge.
# Order matters: it fixes each kid's badge color and label position.
# [[kids]]
# name = "Julia"
# label = "J"
# [[kids]]
# name = "Sam"
# label = "S"
